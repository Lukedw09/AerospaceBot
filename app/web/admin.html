<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrator — Astraeus</title>
  <meta name="description" content="Thumbs-down notes for the Astraeus administrator.">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css?v=20261012k">
</head>
<body data-page="admin">
  <a class="skip" href="#main">Skip to content</a>
  <div class="stars" aria-hidden="true"></div>
  <header class="nav">
    <a class="brand" href="/">
      <span class="brand-mark"><img src="/assets/astraeus.png" alt=""></span>
      <span>Astraeus</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
    <nav class="nav-links" id="nav-links">
      <a href="/install.html" data-page="install">Install</a>
      <a href="/docs.html" data-page="docs">Docs</a>
      <a href="/pricing.html" data-page="pricing">Pricing</a>
      <a href="/faq.html" data-page="faq">FAQ</a>
      <a href="/chat" data-page="chat">Chat</a>
      <a href="/profile.html" data-nav="account" hidden>Account</a>
      <a href="/admin.html" data-page="admin" data-nav="admin" hidden>Administrator</a>
      <button class="nav-signin" type="button" data-nav="signin" data-open-signin>Sign in</button>
    </nav>
  </header>
  <main id="main" class="page" hidden>
    <p id="status" class="banner" role="status"></p>
    <p class="kicker">Administrator</p>
    <h1>Thumbs down</h1>
    <p class="lede">Notes sent from chat, newest first.</p>
    <div id="notes" class="admin-list"></div>
  </main>
  <footer class="foot">
    <div><strong>Astraeus</strong><span>astraeus.de-wet.com</span></div>
    <p>Aerospace plugin for Cursor and Grok Bot.</p>
  </footer>
  <script src="/js/auth.js?v=20261012k"></script>
  <script src="/js/site.js?v=20261012k"></script>
  <script>
    function chatText(item) {
      const history = item.history || [];
      if (history.length) {
        return history.map((turn) => {
          const who = turn.role === "user" ? "User" : "Astraeus";
          return who + ": " + (turn.content || "");
        }).join("\n\n");
      }
      const lines = [];
      if (item.user_message) lines.push("User: " + item.user_message);
      if (item.message) lines.push("Astraeus: " + item.message);
      return lines.join("\n\n");
    }

    function paint(items) {
      const list = document.getElementById("notes");
      list.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("p");
        empty.textContent = "No thumbs-down notes yet.";
        list.appendChild(empty);
        return;
      }
      items.forEach((item) => {
        const note = document.createElement("section");
        note.className = "panel admin-note";
        const when = document.createElement("p");
        when.className = "kicker";
        when.textContent = item.created || "Unknown time";
        const who = document.createElement("p");
        who.textContent = item.email || "Unknown account";
        const reason = document.createElement("p");
        reason.className = "reason";
        reason.textContent = item.reason || "";
        const chat = document.createElement("pre");
        chat.className = "admin-chat";
        chat.textContent = chatText(item);
        note.append(when, who, reason, chat);
        list.appendChild(note);
      });
    }

    AstraeusSite.start();
    if (!AstraeusAuth.hasSession()) {
      location.replace("/");
    } else {
      AstraeusAuth.api("/api/admin/feedback", "GET").then((data) => {
        document.getElementById("main").hidden = false;
        paint(data.items || []);
      }).catch(() => {
        location.replace("/");
      });
    }
  </script>
</body>
</html>
