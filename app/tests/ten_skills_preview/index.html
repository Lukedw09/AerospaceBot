<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ten skill test figures</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 24px; background: #f4f5f7; color: #1a1a1a; }
    h1 { font-size: 1.4rem; font-weight: 600; }
    p { max-width: 46rem; }
    figure { margin: 0 0 28px; background: #fff; border: 1px solid #d8dbe2; padding: 12px 12px 4px; }
    figcaption { font-size: 0.95rem; margin-bottom: 8px; }
    img { width: 100%; max-width: 920px; height: auto; display: block; }
  </style>
</head>
<body>
  <h1>Figures from the ten skill checks</h1>
  <p>Each image is the PNG that skill wrote for its built-in check case. The files are in this folder.</p>
  <figure><figcaption>Pressurant blowdown — 2 MPa, ullage 0.1 m³, 0.1 m³ expelled, isothermal.</figcaption><img src="blowdown.png" alt="Pressurant blowdown"></figure>
  <figure><figcaption>Propellant slosh — 1 m radius, 0.1 m fill.</figcaption><img src="slosh.png" alt="Propellant slosh frequency"></figure>
  <figure><figcaption>Panel buckling — 70 GPa, width 0.5 m, thickness 2 mm, length 1.5 m.</figcaption><img src="panel.png" alt="Panel buckling"></figure>
  <figure><figcaption>Miles rms — 100 Hz, 0.01 g²/Hz, zeta 0.05.</figcaption><img src="miles.png" alt="Random vibration rms"></figure>
  <figure><figcaption>Magnetic torquer — 0.01 N·m, 50 µT.</figcaption><img src="torquer.png" alt="Magnetic torquer"></figure>
  <figure><figcaption>Doppler — 1 GHz, 600 km, elevation mask 0.2 rad.</figcaption><img src="doppler.png" alt="Doppler shift"></figure>
  <figure><figcaption>Dutch roll — 150 m/s sample case.</figcaption><img src="dutch.png" alt="Dutch roll"></figure>
  <figure><figcaption>Geostationary station-keeping — one year of the check drifts.</figcaption><img src="geo.png" alt="Geostationary station keeping"></figure>
  <figure><figcaption>Coverage — 600 km, elevation mask 0.2 rad.</figcaption><img src="coverage.png" alt="Coverage and revisit"></figure>
  <figure><figcaption>Conjunction — 1 km radial offset, 200 s window.</figcaption><img src="miss.png" alt="Conjunction miss distance"></figure>
</body>
</html>
