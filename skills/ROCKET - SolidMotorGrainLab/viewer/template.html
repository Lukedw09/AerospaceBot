<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { color-scheme: light; --ink: #1b2631; --muted: #34495e; --line: #d5d8dc; --paper: #f7f9fb; --card: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  body { min-height: 100%; }
  #app { min-height: 100%; display: grid; grid-template-columns: 320px 1fr; }
  aside { padding: 14px 14px 24px; border-right: 1px solid var(--line); background: var(--card); overflow: auto; }
  main { min-width: 0; display: flex; flex-direction: column; padding: 12px 16px 20px; gap: 10px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 560; }
  h2 { margin: 14px 0 6px; font-size: 13px; font-weight: 650; letter-spacing: 0.02em; }
  p.note { margin: 0 0 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  label { display: grid; grid-template-columns: 1fr 88px; gap: 6px; align-items: center; margin: 0 0 6px; font-size: 12px; }
  input[type="number"], textarea { width: 100%; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); padding: 3px 6px; }
  input[type="range"] { width: 100%; margin: 0 0 8px; }
  #panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  figcaption { font-size: 12px; color: var(--muted); }
  canvas { width: 100%; height: 240px; background: var(--paper); border: 1px solid var(--line); display: block; }
  #status { margin: 0; font-size: 13px; line-height: 1.4; }
  #readout { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px 14px; margin: 0; }
  #readout div { margin: 0; }
  #readout dt { color: var(--muted); font-size: 11px; }
  #readout dd { margin: 0; font-size: 14px; }
  textarea { min-height: 180px; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    #panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>__TITLE__</h1>
    <p class="note">Circular-port solid grain with inhibited ends.</p>
    <h2>Grain</h2>
    <label>Web [m]<input id="web" type="number" step="0.001"></label>
    <input id="web-range" type="range" min="0.01" max="0.3" step="0.001">
    <label>Port radius [m]<input id="port" type="number" step="0.001"></label>
    <input id="port-range" type="range" min="0.01" max="0.25" step="0.001">
    <label>Kn<input id="kn" type="number" step="1"></label>
    <input id="kn-range" type="range" min="20" max="400" step="1">
    <label>Length [m]<input id="length" type="number" step="0.01"></label>
    <label>Sliver [%]<input id="sliver" type="number" step="1" min="0" max="99"></label>
    <h2>Saint Robert</h2>
    <label>a [m/(s·Pa^n)]<input id="a" type="number" step="1e-7"></label>
    <label>n<input id="n" type="number" step="0.01"></label>
    <label>ρ [kg/m³]<input id="rho" type="number" step="10"></label>
    <label>c* [m/s]<input id="cstar" type="number" step="10"></label>
    <h2>Case</h2>
    <label>Wall t [m]<input id="thickness" type="number" step="0.0001"></label>
    <label>Allowable [Pa]<input id="allowable" type="number" step="1e6"></label>
  </aside>
  <main>
    <div id="panels">
      <figure>
        <figcaption>Lateral section</figcaption>
        <canvas id="lateral"></canvas>
      </figure>
      <figure>
        <figcaption>Longitudinal section</figcaption>
        <canvas id="longitudinal"></canvas>
      </figure>
      <figure>
        <figcaption>Chamber pressure</figcaption>
        <canvas id="pc-plot"></canvas>
      </figure>
      <figure>
        <figcaption>Burn area</figcaption>
        <canvas id="ab-plot"></canvas>
      </figure>
    </div>
    <p id="status"></p>
    <dl id="readout"></dl>
    <h2>Export</h2>
    <p class="note">Quote these into the one-shot rocket skills after you settle the grain in this page. Chamber volume still needs an L* you supply.</p>
    <textarea id="export" readonly></textarea>
  </main>
</div>
<script type="application/json" id="seed-json">__SEED_JSON__</script>
<script>
__LAB_JS__
</script>
</body>
</html>
