<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { color-scheme: light; --ink: #1b2631; --muted: #34495e; --line: #d5d8dc; --paper: #f4f7f8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  body { overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  header { padding: 12px 16px 8px; }
  h1 { margin: 0; font-size: 20px; font-weight: 560; }
  #units { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #stage { flex: 1; min-height: 0; display: flex; }
  #viewport { flex: 1; min-width: 0; position: relative; }
  #legend { width: 260px; margin: 0 12px 12px 0; background: #fff; border: 1px solid var(--line); padding: 12px 14px; overflow: auto; font-size: 13px; }
  #legend h2 { margin: 0 0 8px; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 2px; flex: 0 0 auto; border: 1px solid rgba(27, 38, 49, 0.15); }
  #hud { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); }
  button { margin-right: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>__TITLE__</h1>
    <p id="units"></p>
  </header>
  <div id="stage">
    <div id="viewport"></div>
    <aside id="legend"><h2>Legend</h2></aside>
  </div>
</div>
<script>
__THREE_SOURCE__
</script>
<script type="application/json" id="scene-json">__SCENE_JSON__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("scene-json").textContent);
  const viewport = document.getElementById("viewport");
  const legend = document.getElementById("legend");
  document.getElementById("units").textContent = data.units || "Drag to rotate. Scroll to zoom.";
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  renderer.setClearColor(0xf4f7f8, 1);
  viewport.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1e7);
  const cam = data.camera || { position: [2.4, 1.6, 1.8], target: [0, 0, 0] };
  const target = new THREE.Vector3(cam.target[0], cam.target[1], cam.target[2]);
  camera.up.set(0, 0, 1);
  camera.position.set(cam.position[0], cam.position[1], cam.position[2]);
  camera.lookAt(target);
  let radius = camera.position.distanceTo(target);
  const radiusHome = radius;
  let yaw = Math.atan2(camera.position.y - target.y, camera.position.x - target.x);
  let pitch = Math.asin(Math.max(-1, Math.min(1, (camera.position.z - target.z) / Math.max(radius, 1e-6))));

  function row(color, text, object3d) {
    const label = document.createElement("label");
    label.className = "row";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = true;
    box.addEventListener("change", function () { object3d.visible = box.checked; });
    const swatch = document.createElement("i");
    swatch.className = "swatch";
    swatch.style.background = color;
    label.appendChild(box);
    label.appendChild(swatch);
    label.appendChild(document.createTextNode(text));
    legend.appendChild(label);
  }

  (data.spheres || []).forEach(function (ball) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(ball.radius, 48, 32),
      new THREE.MeshBasicMaterial({
        color: ball.color || "#d4e6f1",
        transparent: (ball.opacity == null ? 0.45 : ball.opacity) < 0.99,
        opacity: ball.opacity == null ? 0.45 : ball.opacity,
        depthWrite: (ball.opacity == null ? 0.45 : ball.opacity) > 0.9
      })
    );
    mesh.position.set(ball.center[0], ball.center[1], ball.center[2]);
    scene.add(mesh);
    row(ball.color || "#d4e6f1", ball.name || "shape", mesh);
  });
  const planetRadius = data.planetRadius || 0.98;
  const dashGroups = [];
  function addSolid(group, pts, color, renderOrder) {
    if (pts.length < 2) return;
    const arr = [];
    pts.forEach(function (p) { arr.push(p[0], p[1], p[2]); });
    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    const mesh = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: color, depthTest: false }));
    mesh.renderOrder = renderOrder;
    group.add(mesh);
  }
  function addDashed(group, pts, color) {
    const dash = 0.045;
    const gap = 0.13;
    const period = dash + gap;
    let acc = 0;
    let drawing = [];
    function flush() {
      if (drawing.length > 1) addSolid(group, drawing, color, 6);
      drawing = [];
    }
    for (let i = 1; i < pts.length; i += 1) {
      const a = pts[i - 1];
      const b = pts[i];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const dz = b[2] - a[2];
      const len = Math.hypot(dx, dy, dz);
      if (!(len > 0)) continue;
      let left = len;
      let s0 = 0;
      while (left > 1e-8) {
        const phase = acc % period;
        const on = phase < dash;
        const room = on ? (dash - phase) : (period - phase);
        if (!(room > 1e-8)) break;
        const take = Math.min(left, room);
        const s1 = s0 + take / len;
        if (on) {
          if (!drawing.length) drawing.push([a[0] + dx * s0, a[1] + dy * s0, a[2] + dz * s0]);
          drawing.push([a[0] + dx * s1, a[1] + dy * s1, a[2] + dz * s1]);
        } else if (drawing.length) {
          flush();
        }
        acc += take;
        left -= take;
        s0 = s1;
      }
    }
    flush();
  }
  function behindPoint(p, n) {
    const depth = p[0] * n.x + p[1] * n.y + p[2] * n.z;
    const r2 = p[0] * p[0] + p[1] * p[1] + p[2] * p[2];
    const off = r2 - depth * depth;
    const onCircle = r2 > 0.81 && r2 < 1.44;
    const hide2 = onCircle ? Math.max(planetRadius * planetRadius, r2 * 0.998) : planetRadius * planetRadius;
    if (off >= hide2) return false;
    return depth < Math.sqrt(Math.max(0, hide2 - off));
  }
  function outwardVec() {
    return new THREE.Vector3().subVectors(camera.position, target).normalize();
  }
  function rebuildDashed() {
    const n = outwardVec();
    const cleared = new Set();
    dashGroups.forEach(function (item) {
      const group = item.group;
      if (!cleared.has(group)) {
        for (let i = group.children.length - 1; i >= 0; i -= 1) {
          const child = group.children[i];
          group.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
        cleared.add(group);
      }
      const pts = item.line.points || [];
      let run = [];
      let far = null;
      function flushRun() {
        if (run.length > 1) {
          if (far) addDashed(group, run, item.line.color || "#1b2631");
          else addSolid(group, run, item.line.color || "#1b2631", 4);
        }
        run = [];
      }
      for (let i = 0; i < pts.length; i += 1) {
        const flag = behindPoint(pts[i], n);
        if (far !== null && flag !== far) {
          run.push(pts[i]);
          flushRun();
        }
        far = flag;
        run.push(pts[i]);
      }
      flushRun();
    });
  }
  (data.polylines || []).forEach(function (line) {
    if (line.dashBehind) {
      const group = new THREE.Group();
      scene.add(group);
      dashGroups.push({ line: line, group: group });
      if (line.name) row(line.color || "#1b2631", line.name, group);
      return;
    }
    const group = new THREE.Group();
    addSolid(group, line.points || [], line.color || "#1b2631", 4);
    scene.add(group);
    if (line.name) row(line.color || "#1b2631", line.name, group);
  });
  if ((data.arrows || []).length) {
    const spin = new THREE.Group();
    scene.add(spin);
    data.arrows.forEach(function (pts) {
      dashGroups.push({ line: { points: pts, color: "#1a365d" }, group: spin });
    });
    row("#1a365d", "Earth rotation", spin);
  }
  const path = data.path || [];
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(data.markerRadius || 0.035, 16, 12),
    new THREE.MeshBasicMaterial({ color: data.markerColor || "#c0392b" })
  );
  if (path.length) {
    marker.position.set(path[0][0], path[0][1], path[0][2]);
    scene.add(marker);
    row(data.markerColor || "#c0392b", data.markerLabel || "marker", marker);
  }
  const hud = document.createElement("div");
  hud.id = "hud";
  const play = document.createElement("button");
  play.type = "button";
  play.textContent = "Pause";
  const readout = document.createElement("span");
  hud.appendChild(play);
  hud.appendChild(readout);
  if (path.length > 1) legend.appendChild(hud);
  let playing = path.length > 1;
  let u = 0;
  play.addEventListener("click", function () {
    playing = !playing;
    play.textContent = playing ? "Pause" : "Play";
  });
  let drag = null;
  renderer.domElement.addEventListener("pointerdown", function (ev) {
    drag = { x: ev.clientX, y: ev.clientY, yaw: yaw, pitch: pitch };
  });
  window.addEventListener("pointerup", function () { drag = null; });
  window.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    yaw = drag.yaw - (ev.clientX - drag.x) * 0.005;
    pitch = Math.max(-1.2, Math.min(1.2, drag.pitch + (ev.clientY - drag.y) * 0.005));
  });
  renderer.domElement.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    radius *= ev.deltaY > 0 ? 1.08 : 0.92;
    radius = Math.max(radiusHome * 0.2, Math.min(radius, radiusHome * 6));
  }, { passive: false });
  function placeCamera() {
    const cp = Math.cos(pitch);
    camera.position.set(
      target.x + radius * cp * Math.cos(yaw),
      target.y + radius * cp * Math.sin(yaw),
      target.z + radius * Math.sin(pitch)
    );
    camera.up.set(0, 0, 1);
    camera.lookAt(target);
  }
  let camKey = "";
  function frame() {
    placeCamera();
    const key = yaw.toFixed(3) + "," + pitch.toFixed(3);
    if (key !== camKey) {
      camKey = key;
      rebuildDashed();
    }
    if (playing && path.length > 1) {
      u = (u + 0.0025) % 1;
      const f = u * (path.length - 1);
      const i = Math.floor(f);
      const t = f - i;
      const a = path[i];
      const b = path[Math.min(i + 1, path.length - 1)];
      marker.position.set(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
      readout.textContent = (data.markerLabel || "marker") + " " + (100 * u).toFixed(0) + "%";
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  function resize() {
    const w = viewport.clientWidth || 800;
    const h = viewport.clientHeight || 600;
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener("resize", resize);
  resize();
  placeCamera();
  frame();
})();
</script>
</body>
</html>
